[project]
name = "aiforforeignlanguagelearning-backend"
version = "0.1.0"
description = "FastAPI backend for AI for Foreign Language Learning (migration)"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic-settings>=2.2",
  "sqlmodel>=0.0.21",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "httpx>=0.27",
  "jinja2>=3.1",
  "structlog>=24.1",
  "email-validator>=2.1",
  "python-jose>=3.3",
  "passlib[bcrypt]>=1.7",
  "celery>=5.4",
  "kombu>=5.3",
  "minio>=7.2",
  "python-multipart>=0.0.9",
  "webrtcvad>=2.0.10",
  "tenacity>=8.2",
  "redis>=5.0",
  "prometheus-client>=0.20",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-timeout>=2.3",
  "ruff>=0.6",
  "soundfile>=0.12",
  "librosa>=0.10",
]
search = [
  "elasticsearch>=8.13",
]
ai = [
  "numpy>=1.26",
  "pillow>=10.0",
  "torch>=2.0",
  "torchaudio>=2.0",
  "transformers>=4.35",
  "soundfile>=0.12",
  "librosa>=0.10",
  "scipy>=1.11",
  "pandas>=2.0",
  "opencv-python>=4.8",
  "edge-tts>=6.1",
  "kokoro-onnx>=0.4",
  "pydub>=0.25",
  "tiktoken>=0.12",
  "webrtcvad-wheels>=2.0",
  "faiss-cpu>=1.13",
  "imagehash>=4.3",
  "neo4j>=6.1",
  "rapidocr-onnxruntime>=1.2",
  "paddleocr>=3.4",
]
ml = [
  "numpy>=1.26",
  "pillow>=10.0",
  "opencv-python>=4.9",
  "torch>=2.2",
  "torchaudio>=2.2",
  "transformers>=4.39",
  "soundfile>=0.12",
  "scipy>=1.12",
  "pandas>=2.2",
  "edge-tts>=6.1",
  "kokoro-onnx>=0.4",
  "faiss-cpu>=1.13",
  "imagehash>=4.3",
  "pydub>=0.25",
  "tiktoken>=0.12",
  "webrtcvad-wheels>=2.0",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
markers = [
  "integration: requires real external services/models (LM Studio/ASR/TTS), skipped by default",
]

# 防止测试在 ws.receive_json() 等阻塞点无限等待。
# Windows 推荐 thread 模式。
timeout = 60
timeout_method = "thread"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools]
packages = ["app"]
include-package-data = false
